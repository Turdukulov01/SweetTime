services:
  bootstrap:
    image: sweettime-backend:${SWEETIME_IMAGE_TAG:-local}
    pull_policy: never
    restart: "no"
    user: "${SWEETIME_UID:-1000}:${SWEETIME_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set an URL-encoded DATABASE_URL in deploy/production/.env}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/production/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set HTTPS CORS_ORIGINS in deploy/production/.env}
      STAFF_INVITE_PUBLIC_URL: ${ADMIN_PUBLIC_API_URL:?Set the public HTTPS admin origin in deploy/production/.env}
      OTP_MODE: disabled
      SEED_MODE: none
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:?Set the real owner email}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:?Set the real owner name}
      BOOTSTRAP_OWNER_PASSWORD_FILE: /run/secrets/bootstrap_owner_password
    volumes:
      - ${BOOTSTRAP_OWNER_PASSWORD_FILE:?Set an absolute host path to the owner password file}:/run/secrets/bootstrap_owner_password:ro
    command: ["python", "-m", "api.bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully
