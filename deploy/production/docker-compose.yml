x-backend-image: &backend-image sweettime-backend:${SWEETIME_IMAGE_TAG:-local}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sweettime}
      POSTGRES_USER: ${POSTGRES_USER:-sweettime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production/.env}
    volumes:
      - /srv/sweetime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: *backend-image
    # `docker compose up --build` builds backend first; never pull a private/local tag by accident.
    pull_policy: never
    restart: "no"
    user: "${SWEETIME_UID:-1000}:${SWEETIME_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set an URL-encoded DATABASE_URL in deploy/production/.env}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/production/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set HTTPS CORS_ORIGINS in deploy/production/.env}
      OTP_MODE: disabled
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_OAUTH_WEB_CLIENT_ID: ${GOOGLE_OAUTH_WEB_CLIENT_ID:-}
      GOOGLE_OAUTH_AUTHORIZED_PARTY_IDS: ${GOOGLE_OAUTH_AUTHORIZED_PARTY_IDS:-[]}
      SEED_MODE: none
    command: ["alembic", "-c", "/app/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: backend/api/Dockerfile
    image: *backend-image
    restart: unless-stopped
    user: "${SWEETIME_UID:-1000}:${SWEETIME_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set an URL-encoded DATABASE_URL in deploy/production/.env}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/production/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set HTTPS CORS_ORIGINS in deploy/production/.env}
      OTP_MODE: disabled
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_OAUTH_WEB_CLIENT_ID: ${GOOGLE_OAUTH_WEB_CLIENT_ID:-}
      GOOGLE_OAUTH_AUTHORIZED_PARTY_IDS: ${GOOGLE_OAUTH_AUTHORIZED_PARTY_IDS:-[]}
      SEED_MODE: none
      MEDIA_ROOT: /app/media
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-/media}
      MEDIA_MAX_IMAGE_BYTES: 10485760
      MEDIA_MAX_IMAGE_PIXELS: 25000000
    volumes:
      # Файл физически остаётся на сервере, а не в writable layer контейнера.
      - /srv/sweetime/media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Безопасный default: только loopback, за существующим TLS reverse proxy хоста.
      - "${SWEETIME_HTTP_BIND:-127.0.0.1}:${SWEETIME_HTTP_PORT:-8080}:80"
    volumes:
      - /srv/sweetime/media:/srv/sweetime/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
