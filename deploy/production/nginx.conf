server {
    listen 80;
    # TLS/domain routing is owned by the host reverse proxy in front of 127.0.0.1:8080.
    server_name _;
    server_tokens off;

    # 10 MiB полезной нагрузки + небольшой multipart overhead.
    client_max_body_size 11m;

    location /api/ {
        # Без завершающего slash: иначе nginx срежет префикс /api/.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Readiness includes a real PostgreSQL probe and is used by Compose/nginx monitoring.
    location = /ready {
        proxy_pass http://backend:8000/ready;
        proxy_set_header Host $host;
    }

    # Временные upload-файлы никогда не публикуются.
    location ^~ /media/temp/ {
        deny all;
    }

    location ^~ /media/ {
        alias /srv/sweetime/media/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}
