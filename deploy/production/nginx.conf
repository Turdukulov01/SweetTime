map $http_x_real_ip $sweettime_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

map $http_x_forwarded_proto $sweettime_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    # TLS/domain routing is owned by the host reverse proxy in front of 127.0.0.1:8080.
    server_name _;
    server_tokens off;
    # Keep nginx-owned redirects relative: TLS terminates on the host proxy, so
    # an absolute redirect generated here would otherwise incorrectly use http.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 50 MiB MP4 payload + bounded multipart overhead.
    client_max_body_size 52m;

    location /api/ {
        # Без завершающего slash: иначе nginx срежет префикс /api/.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sweettime_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sweettime_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Readiness includes a real PostgreSQL probe and is used by Compose/nginx monitoring.
    location = /ready {
        proxy_pass http://backend:8000/ready;
        proxy_set_header Host $host;
    }

    # Временные upload-файлы никогда не публикуются.
    location ^~ /media/temp/ {
        deny all;
    }

    location ^~ /media/ {
        alias /srv/sweetime/media/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        # nginx serves MP4 byte ranges from the read-only media volume.
        max_ranges 1;
    }

    location = /admin {
        return 302 /login;
    }

    location = /admin/ {
        return 302 /login;
    }

    # Custom Next.js admin. API, readiness and media locations above remain
    # owned by the backend stack and therefore take precedence over this route.
    location / {
        proxy_pass http://admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sweettime_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sweettime_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
