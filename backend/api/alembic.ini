# Alembic-конфигурация боевого backend (backend/api).
# Запуск из папки backend/:
#   py -m alembic -c api/alembic.ini upgrade head
#   py -m alembic -c api/alembic.ini revision --autogenerate -m "..."
# DATABASE_URL берётся из настроек (api.config) в migrations/env.py и
# перекрывает значение sqlalchemy.url ниже.

[alembic]
# %(here)s — папка этого ini-файла (backend/api), не зависит от cwd.
script_location = %(here)s/migrations
prepend_sys_path = .
# Плейсхолдер: реальный URL подставляется в env.py из api.config.settings.
sqlalchemy.url = postgresql+psycopg://sweettime:sweettime@localhost:5432/sweettime

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
