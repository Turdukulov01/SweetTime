services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sweettime
      POSTGRES_USER: sweettime
      POSTGRES_PASSWORD: sweettime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sweettime:sweettime@postgres:5432/sweettime
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-before-production
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://sweettime:sweettime@postgres:5432/sweettime
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-before-production
    depends_on:
      - api
      - redis

  celery_beat:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://sweettime:sweettime@postgres:5432/sweettime
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-before-production
    depends_on:
      - api
      - redis

  admin:
    build:
      context: ./admin
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - admin

volumes:
  postgres_data:
